name: PyQPanda Algorithm CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
    tags: ["*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Build the distribution in every supported environment, but preserve the
  # wheel tags emitted by the builder. setup.py is currently pure Python, so
  # bdist_wheel correctly produces a portable py3-none-any wheel.
  build-wheels:
    name: Wheel Build (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        working-directory: pyqpanda-algorithm
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel setuptools
          python -m build --wheel

      - name: Validate wheel filename and metadata tags
        run: python .github/scripts/validate_wheel_tags.py "pyqpanda-algorithm/dist/*.whl"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pyqpanda-algorithm/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  docs-build:
    name: Documentation Build
    runs-on: ubuntu-latest
    needs: [build-wheels]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build Documentation
        run: |
          set -e
          python -m pip install sphinx sphinx_autoapi sphinx-material beautifulsoup4
          cd Tutorials/source
          rm -rf build
          sphinx-build -b html ./ ./build/
          cd ../..
          mkdir -p output/docs/html
          cp -r Tutorials/source/build/* output/docs/html/
          cat > output/docs/README.md << 'EOF'
          # PyQPanda Algorithm 项目文档

          本文档使用 Sphinx + AutoAPI 自动生成。打开 `html/index.html` 浏览。
          EOF

      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: output/docs/
          retention-days: 7

  automated-testing:
    name: Automated Testing
    runs-on: ubuntu-latest
    needs: [build-wheels]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download canonical Linux wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheel-ubuntu-latest-py3.10
          path: downloaded-wheels/

      - name: Validate downloaded wheel tags
        run: python .github/scripts/validate_wheel_tags.py "downloaded-wheels/*.whl"

      - name: Run Automated Tests
        run: |
          set -e
          WHEEL_FILE=$(find downloaded-wheels -name "*.whl" | head -1)
          if [ -z "$WHEEL_FILE" ]; then
            echo "❌ 未找到wheel包"
            exit 1
          fi

          python -m pip install "$WHEEL_FILE"
          python -m pip install numpy scipy sympy pandas
          if [ -f "pyqpanda-algorithm/requirements.txt" ]; then
            python -m pip install -r pyqpanda-algorithm/requirements.txt
          fi
          python -m pip install pytest allure-pytest pytest-html pytest-rerunfailures pytest-xdist

          mkdir -p output/test_results/allure-results output/test_results/html-report
          cd test
          pytest -v \
            --junitxml=../output/test_results/junit-results.xml \
            --alluredir=../output/test_results/allure-results \
            --clean-alluredir \
            --tb=short \
            --disable-warnings \
            --maxfail=5 \
            || true
          pytest -v \
            --html=../output/test_results/html-report/report.html \
            --self-contained-html \
            --tb=short \
            --disable-warnings \
            --maxfail=5 \
            || true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: output/test_results/
          retention-days: 7

  package-all:
    name: Package All Artifacts
    runs-on: ubuntu-latest
    needs: [build-wheels, docs-build, automated-testing]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download every wheel build
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: all-artifacts/wheels
          merge-multiple: false

      - name: Download Documentation
        uses: actions/download-artifact@v4
        with:
          name: documentation-html
          path: all-artifacts/docs/

      - name: Download Test Results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: all-artifacts/tests/

      - name: Validate and package release artifacts
        run: |
          set -e
          WHEEL_COUNT=$(find all-artifacts/wheels -name "*.whl" -type f | wc -l | tr -d ' ')
          if [ "$WHEEL_COUNT" -ne 9 ]; then
            echo "❌ expected 9 matrix wheel artifacts, found $WHEEL_COUNT"
            find all-artifacts/wheels -maxdepth 3 -type f -print
            exit 1
          fi

          python .github/scripts/validate_wheel_tags.py "all-artifacts/wheels/**/*.whl"

          mkdir -p release_package/wheels release_package/release release_package/docs release_package/test_reports
          cp -R all-artifacts/wheels/. release_package/wheels/
          cp -R all-artifacts/docs/. release_package/docs/
          cp -R all-artifacts/tests/. release_package/test_reports/

          CANONICAL_WHEEL=$(find all-artifacts/wheels/wheel-ubuntu-latest-py3.10 -name "*.whl" -type f | head -1)
          if [ -z "$CANONICAL_WHEEL" ]; then
            echo "❌ canonical universal wheel missing"
            exit 1
          fi
          cp "$CANONICAL_WHEEL" release_package/release/

          cat > release_package/README.md << 'EOF'
          # PyQPanda Algorithm 发布包

          ## Wheel 兼容性

          当前 `setup.py` 构建的是纯 Python wheel。构建器生成的 `py3-none-any` 标签会原样保留，
          不再通过重命名伪造 CPython ABI 或操作系统平台标签。工作流会在 Linux、Windows、macOS
          的 Python 3.10、3.11、3.12 上分别构建并校验 wheel，共 9 个构建证明副本，保存在
          `wheels/<artifact>/` 下。

          GitHub Release 只发布一个经过校验的 canonical universal wheel，位于 `release/`，
          因为同一个 `py3-none-any` wheel 本身不需要按平台或 Python 小版本拆分。

          ## 包含内容
          - `release/`: canonical universal wheel
          - `wheels/`: 9 个环境构建/校验副本
          - `docs/`: Sphinx HTML 文档
          - `test_reports/`: 自动化测试报告
          EOF
          {
            echo ""
            echo "## 构建信息"
            echo "- 构建系统: GitHub Actions"
            echo "- 构建时间: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- 环境构建 wheel 数量: $WHEEL_COUNT"
          } >> release_package/README.md

          echo "✅ 发布包校验完成"
          find release_package -type f | sort

      - name: Upload Final Package
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release_package/
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release_package/release/*.whl
            release_package/docs/html/index.html
          body_path: release_package/README.md

  workflow-summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs: [package-all]
    if: always()

    steps:
      - name: Check workflow status
        run: |
          echo "🎉 PyQPanda Algorithm CI/CD Pipeline 执行完成!"
          echo "📦 wheel build matrix: Linux / Windows / macOS × Python 3.10 / 3.11 / 3.12"
          echo "🔒 wheel filename tags are verified against internal WHEEL metadata"
          echo "📂 release-package contains all 9 build proofs plus one canonical universal release wheel"
