name: Oracle-learning successor acceptance
on:
  push:
    branches: [validation/origin59-native-20261004-3600]
    paths: [.github/workflows/oracle-native-acceptance.yml]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: woahwhattheheck/pyqpanda-algorithm
          ref: 440210a67e84ed29bb156fa77251b2c8e69aa386
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and focused test runner
        shell: bash
        run: |
          mkdir -p evidence
          python -m pip install -r pyqpanda-algorithm/requirements.txt 'pyqpanda3==0.5.0' 'pytest==9.1.1' scikit-learn pandas allure-pytest 2>&1 | tee evidence/install.log
          python -m pip freeze > evidence/environment.txt
          python -VV >> evidence/environment.txt
          uname -a >> evidence/environment.txt
          git rev-parse HEAD > evidence/source-sha.txt
      - name: Check source and run maintained focused cases
        shell: bash
        env:
          PYTHONPATH: pyqpanda-algorithm
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          record = json.loads(Path('benchmarks/results/oracle-walsh-20261004.json').read_text())
          source = Path('pyqpanda-algorithm/pyqpanda_alg/QOracleLearning/oracle_learning.py').read_bytes()
          benchmark = Path('benchmarks/benchmark_oracle_walsh.py').read_bytes()
          assert hashlib.sha256(source).hexdigest() == record['candidate_sha256']
          assert hashlib.sha256(benchmark).hexdigest() == record['benchmark_sha256']
          from pyqpanda3.core import CPUQVM
          print('Native CPUQVM:', CPUQVM)
          PY
          python -m pytest -q test/QOracleLearning --junitxml=evidence/tests.xml 2>&1 | tee evidence/tests.log
          python - <<'PY'
          import xml.etree.ElementTree as ET
          totals = {key: 0 for key in ('tests', 'failures', 'errors', 'skipped')}
          for suite in ET.parse('evidence/tests.xml').getroot().iter('testsuite'):
              for key in totals:
                  totals[key] += int(suite.get(key, '0'))
          print('Maintained selection:', totals)
          assert totals == {'tests': 11, 'failures': 0, 'errors': 0, 'skipped': 0}, totals
          PY
          python pyqpanda-algorithm/example/QAlgBase/testeg_QOracleLearning.py 2>&1 | tee evidence/example.log
          git diff --exit-code
      - name: Reproduce the classical benchmark on this runner
        shell: bash
        run: |
          python benchmarks/benchmark_oracle_walsh.py --output evidence/walsh-benchmark.json 2>&1 | tee evidence/benchmark.log
          git diff --exit-code
      - name: Retain source and results
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          git archive --format=tar.gz HEAD > evidence/source.tar.gz
          git ls-tree -r HEAD > evidence/source-tree.txt
          git status --porcelain > evidence/source-status.txt
          find evidence -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > evidence-manifest.sha256
          cp evidence-manifest.sha256 evidence/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-walsh-successor-acceptance
          path: evidence/
          retention-days: 14
          if-no-files-found: error
